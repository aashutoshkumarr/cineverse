<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" width="100%" height="100%">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows for Cards -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <marker id="arrowPink" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ec4899" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 900; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; fill: #94a3b8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 21px; fill: #ffffff; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 13px; fill: rgba(255,255,255,0.9); letter-spacing: 0.5px; }
    .sec-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; }
    .item-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #cbd5e1; }
    .ribbon-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 15px; fill: #38bdf8; letter-spacing: 0.3px; }
  </style>

  <!-- Deep Cosmic Canvas Background -->
  <rect width="1400" height="780" fill="#090d16" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.35">
    <line x1="0" y1="100" x2="1400" y2="100" />
    <line x1="0" y1="200" x2="1400" y2="200" />
    <line x1="0" y1="300" x2="1400" y2="300" />
    <line x1="0" y1="400" x2="1400" y2="400" />
    <line x1="0" y1="500" x2="1400" y2="500" />
    <line x1="0" y1="600" x2="1400" y2="600" />
    <line x1="0" y1="700" x2="1400" y2="700" />
    <line x1="200" y1="0" x2="200" y2="780" />
    <line x1="400" y1="0" x2="400" y2="780" />
    <line x1="600" y1="0" x2="600" y2="780" />
    <line x1="800" y1="0" x2="800" y2="780" />
    <line x1="1000" y1="0" x2="1000" y2="780" />
    <line x1="1200" y1="0" x2="1200" y2="780" />
  </g>

  <!-- Title Header -->
  <text x="700" y="55" class="title" font-size="36" text-anchor="middle">CINEVERSE SYSTEM WORKFLOW & ARCHITECTURE</text>
  <text x="700" y="88" class="subtitle" text-anchor="middle">Interactive Flow: Discovery ➔ ML Recommendation Engine ➔ High-Speed Multi-CDN Playback</text>

  <!-- ==================== COLUMN 1: FRONTEND ==================== -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="50" y="130" width="390" height="520" rx="18" fill="#0f172a" stroke="#ec4899" stroke-width="2" />
    <!-- Top Gradient Header -->
    <rect x="50" y="130" width="390" height="70" rx="18" fill="url(#pinkGrad)" />
    <rect x="50" y="180" width="390" height="20" fill="url(#pinkGrad)" />
    
    <text x="72" y="156" class="badge">STEP 01</text>
    <text x="72" y="182" class="card-title">DISCOVERY & UI CLIENT</text>
    <text x="415" y="172" class="badge" text-anchor="end">React 18 · Vite</text>
  </g>

  <!-- Col 1 Details -->
  <!-- Sub-block 1 -->
  <g transform="translate(70, 225)">
    <text x="0" y="0" class="sec-title" fill="#f43f5e">🔍 Live Search & Filter Bar</text>
    <circle cx="6" cy="19" r="3" fill="#f43f5e" />
    <text x="18" y="23" class="item-text">Pill capsule input with 280ms debounce</text>
    <circle cx="6" cy="41" r="3" fill="#f43f5e" />
    <text x="18" y="45" class="item-text">Filter by Country (India, Korea, US, Japan)</text>
    <circle cx="6" cy="63" r="3" fill="#f43f5e" />
    <text x="18" y="67" class="item-text">Category tags (K-Drama, Anime, Cinema)</text>
  </g>

  <!-- Sub-block 2 -->
  <g transform="translate(70, 335)">
    <text x="0" y="0" class="sec-title" fill="#f43f5e">♾️ Continuous Browsing</text>
    <circle cx="6" cy="19" r="3" fill="#f43f5e" />
    <text x="18" y="23" class="item-text">Infinite scroll preloads 48 titles per batch</text>
    <circle cx="6" cy="41" r="3" fill="#f43f5e" />
    <text x="18" y="45" class="item-text">Advance 400px rootMargin pre-fetch</text>
    <circle cx="6" cy="63" r="3" fill="#f43f5e" />
    <text x="18" y="67" class="item-text">Floating one-click Back-to-Top button</text>
  </g>

  <!-- Sub-block 3 -->
  <g transform="translate(70, 445)">
    <text x="0" y="0" class="sec-title" fill="#f43f5e">💾 State & Memory Persistence</text>
    <circle cx="6" cy="19" r="3" fill="#f43f5e" />
    <text x="18" y="23" class="item-text">Saves preferred server in localStorage</text>
    <circle cx="6" cy="41" r="3" fill="#f43f5e" />
    <text x="18" y="45" class="item-text">Never prompts user to re-switch servers</text>
    <circle cx="6" cy="63" r="3" fill="#f43f5e" />
    <text x="18" y="67" class="item-text">Automatic dark glassmorphic styling</text>
  </g>

  <!-- ==================== COLUMN 2: FASTAPI & ML ENGINE ==================== -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="505" y="130" width="390" height="520" rx="18" fill="#0f172a" stroke="#c084fc" stroke-width="2" />
    <!-- Top Gradient Header -->
    <rect x="505" y="130" width="390" height="70" rx="18" fill="url(#purpleGrad)" />
    <rect x="505" y="180" width="390" height="20" fill="url(#purpleGrad)" />
    
    <text x="527" y="156" class="badge">STEP 02</text>
    <text x="527" y="182" class="card-title">FASTAPI & ML ENGINE</text>
    <text x="870" y="172" class="badge" text-anchor="end">Python · Scikit-Learn</text>
  </g>

  <!-- Col 2 Details -->
  <!-- Sub-block 1 -->
  <g transform="translate(525, 225)">
    <text x="0" y="0" class="sec-title" fill="#c084fc">⚡ High-Speed Async Backend</text>
    <circle cx="6" cy="19" r="3" fill="#c084fc" />
    <text x="18" y="23" class="item-text">FastAPI async endpoints (~80ms latency)</text>
    <circle cx="6" cy="41" r="3" fill="#c084fc" />
    <text x="18" y="45" class="item-text">No synchronous blocking network timeouts</text>
    <circle cx="6" cy="63" r="3" fill="#c084fc" />
    <text x="18" y="67" class="item-text">Automated server ping health checks</text>
  </g>

  <!-- Sub-block 2 -->
  <g transform="translate(525, 335)">
    <text x="0" y="0" class="sec-title" fill="#c084fc">🤖 Hybrid ML Recommender</text>
    <circle cx="6" cy="19" r="3" fill="#c084fc" />
    <text x="18" y="23" class="item-text">Cosine Similarity on 5k movie tag vectors</text>
    <circle cx="6" cy="41" r="3" fill="#c084fc" />
    <text x="18" y="45" class="item-text">Catalog-First Matching: verified posters</text>
    <circle cx="6" cy="63" r="3" fill="#c084fc" />
    <text x="18" y="67" class="item-text">Intelligent genre & country hybrid fallback</text>
  </g>

  <!-- Sub-block 3 -->
  <g transform="translate(525, 445)">
    <text x="0" y="0" class="sec-title" fill="#c084fc">🗄️ Database & Storage Layer</text>
    <circle cx="6" cy="19" r="3" fill="#c084fc" />
    <text x="18" y="23" class="item-text">Curated 2,500+ local titles catalog cache</text>
    <circle cx="6" cy="41" r="3" fill="#c084fc" />
    <text x="18" y="45" class="item-text">SQLite database (app.db) for watchlist</text>
    <circle cx="6" cy="63" r="3" fill="#c084fc" />
    <text x="18" y="67" class="item-text">Resume playback timestamp persistence</text>
  </g>

  <!-- ==================== COLUMN 3: STREAMING PLAYBACK ==================== -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="960" y="130" width="390" height="520" rx="18" fill="#0f172a" stroke="#34d399" stroke-width="2" />
    <!-- Top Gradient Header -->
    <rect x="960" y="130" width="390" height="70" rx="18" fill="url(#greenGrad)" />
    <rect x="960" y="180" width="390" height="20" fill="url(#greenGrad)" />
    
    <text x="982" y="156" class="badge">STEP 03</text>
    <text x="982" y="182" class="card-title">STREAMING & PLAYBACK</text>
    <text x="1325" y="172" class="badge" text-anchor="end">Global CDN Redundancy</text>
  </g>

  <!-- Col 3 Details -->
  <!-- Sub-block 1 -->
  <g transform="translate(980, 225)">
    <text x="0" y="0" class="sec-title" fill="#34d399">🚀 100% Live Verified CDN Mirrors</text>
    <circle cx="6" cy="19" r="3" fill="#34d399" />
    <text x="18" y="23" class="item-text">Server 1: vidsrc.su (Ultra-Fast 200 OK)</text>
    <circle cx="6" cy="41" r="3" fill="#34d399" />
    <text x="18" y="45" class="item-text">Server 2: vidlink.pro (Direct Full HD)</text>
    <circle cx="6" cy="63" r="3" fill="#34d399" />
    <text x="18" y="67" class="item-text">Server 3: vidsrc.pm (Reliable Failover)</text>
  </g>

  <!-- Sub-block 2 -->
  <g transform="translate(980, 335)">
    <text x="0" y="0" class="sec-title" fill="#34d399">📺 Multi-Season & Episodes</text>
    <circle cx="6" cy="19" r="3" fill="#34d399" />
    <text x="18" y="23" class="item-text">Exact Season 1 to N episode numbering</text>
    <circle cx="6" cy="41" r="3" fill="#34d399" />
    <text x="18" y="45" class="item-text">Authentic episode thumbnails & still previews</text>
    <circle cx="6" cy="63" r="3" fill="#34d399" />
    <text x="18" y="67" class="item-text">Full movies & complete web series episodes</text>
  </g>

  <!-- Sub-block 3 -->
  <g transform="translate(980, 445)">
    <text x="0" y="0" class="sec-title" fill="#34d399">🛡️ Distraction-Free Experience</text>
    <circle cx="6" cy="19" r="3" fill="#34d399" />
    <text x="18" y="23" class="item-text">Zero "refused to connect" domain errors</text>
    <circle cx="6" cy="41" r="3" fill="#34d399" />
    <text x="18" y="45" class="item-text">Sandboxed iframe prevents rogue redirects</text>
    <circle cx="6" cy="63" r="3" fill="#34d399" />
    <text x="18" y="67" class="item-text">Seamless single-click start</text>
  </g>

  <!-- ==================== CONNECTING ARROWS ==================== -->
  <!-- Arrow 1 -> 2 -->
  <line x1="440" y1="380" x2="505" y2="380" stroke="#ec4899" stroke-width="4" marker-end="url(#arrowPink)" />
  <!-- Arrow 2 -> 3 -->
  <line x1="895" y1="380" x2="960" y2="380" stroke="#c084fc" stroke-width="4" marker-end="url(#arrowPurple)" />

  <!-- ==================== BOTTOM REAL-TIME SYNC RIBBON ==================== -->
  <g filter="url(#shadow)">
    <rect x="50" y="675" width="1300" height="60" rx="14" fill="#0b1329" stroke="#38bdf8" stroke-width="1.8" />
    <text x="700" y="711" class="ribbon-text" text-anchor="middle">
      ⚡ REAL-TIME SYNC: LocalStorage Preferred Server Memory ➔ Instant 1-Click Playback ➔ SQLite Playback Resume
    </text>
  </g>
</svg>
