<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0e172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Nebula Glow Gradients -->
    <radialGradient id="nebulaBlue" cx="30%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaPurple" cx="70%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#701a75" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#3b0764" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Core Brand Planet Gradient (Vibrant Pink to Purple) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="35%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ring Gradient with Depth -->
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="30%" stop-color="#ec4899" />
      <stop offset="70%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Inner Core Glow Filter -->
    <filter id="cosmicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip for Behind Ring -->
    <clipPath id="cutBehind">
      <rect x="0" y="0" width="512" height="260" />
    </clipPath>
    <!-- Clip for Front Ring -->
    <clipPath id="cutFront">
      <rect x="0" y="240" width="512" height="272" />
    </clipPath>
  </defs>

  <!-- Card Background with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="90" fill="url(#spaceBg)" />
  <rect width="512" height="512" rx="90" fill="url(#nebulaBlue)" />
  <rect width="512" height="512" rx="90" fill="url(#nebulaPurple)" />

  <!-- Stars / Space Stardust Field -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="85" cy="95" r="1.5" />
    <circle cx="120" cy="180" r="1.2" opacity="0.5" />
    <circle cx="90" cy="380" r="1.8" />
    <circle cx="160" cy="420" r="1.4" opacity="0.6" />
    <circle cx="430" cy="110" r="2.0" opacity="0.9" />
    <circle cx="390" cy="210" r="1.2" opacity="0.4" />
    <circle cx="440" cy="390" r="1.6" />
    <circle cx="370" cy="430" r="1.5" opacity="0.7" />
    <circle cx="210" cy="70" r="2.2" opacity="0.8" />
    <circle cx="320" cy="85" r="1.3" opacity="0.5" />
    <circle cx="280" cy="450" r="1.7" />
    <circle cx="70" cy="270" r="1.5" opacity="0.6" />
    <circle cx="450" cy="260" r="1.4" opacity="0.6" />
    <!-- Twinkle crosses -->
    <path d="M 430,105 L 430,115 M 425,110 L 435,110" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
    <path d="M 90,375 L 90,385 M 85,380 L 95,380" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
  </g>

  <!-- BACK PORTION OF THE PLANETARY RING (renders behind the C planet) -->
  <g transform="translate(256, 256) rotate(-22)" clip-path="url(#cutBehind)">
    <!-- Back ellipse ring arc -->
    <path d="M -195,0 A 195 44 0 0 1 195,0" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" opacity="0.95" />
  </g>

  <!-- MAIN PLANET 'C' BODY -->
  <!-- Outer C Arc: Radius 112px, Inner C Cutout: Radius 54px -->
  <g filter="url(#cosmicGlow)">
    <path d="
      M 315, 175
      A 115 115 0 1 0 315, 337
      L 278, 303
      A 65 65 0 1 1 278, 209
      Z
    " fill="url(#brandGrad)" />
  </g>

  <!-- INNER MOONS / BUBBLE SPHERES IN THE C CAVITY -->
  <!-- Main upper bubble moon -->
  <circle cx="272" cy="202" r="13" fill="url(#brandGrad)" filter="url(#cosmicGlow)" />
  <!-- Secondary adjacent small moon -->
  <circle cx="289" cy="214" r="7.5" fill="url(#brandGrad)" filter="url(#cosmicGlow)" />
  <!-- Tertiary micro moon -->
  <circle cx="275" cy="226" r="5" fill="url(#brandGrad)" filter="url(#cosmicGlow)" />

  <!-- FRONT PORTION OF THE PLANETARY RING (cuts across the front of the C) -->
  <g transform="translate(256, 256) rotate(-22)">
    <!-- Ring gap slice to give dynamic 3D looping effect -->
    <path d="M -195,0 A 195 44 0 0 0 195,0" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" filter="url(#cosmicGlow)" />
    <!-- Specular highlight streak on front ring -->
    <path d="M -130,28 A 195 44 0 0 0 130,28" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Subtle Rim Light & Card Border -->
  <rect width="510" height="510" x="1" y="1" rx="89" fill="none" stroke="rgba(255, 255, 255, 0.16)" stroke-width="2" />
</svg>
