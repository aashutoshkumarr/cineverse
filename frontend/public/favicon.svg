<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="planetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Background Circle -->
  <rect width="100" height="100" rx="22" fill="#040d1a"/>
  
  <!-- Star Specks -->
  <circle cx="20" cy="25" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="80" cy="20" r="1.2" fill="#ffffff" opacity="0.8"/>
  <circle cx="28" cy="78" r="0.8" fill="#ffffff" opacity="0.5"/>
  <circle cx="75" cy="82" r="1" fill="#ffffff" opacity="0.7"/>
  <circle cx="85" cy="55" r="0.7" fill="#ffffff" opacity="0.4"/>
  <circle cx="15" cy="50" r="0.9" fill="#ffffff" opacity="0.6"/>

  <!-- Planet C Body -->
  <path d="M 68 28 C 42 16, 22 36, 24 58 C 26 76, 44 86, 68 76 C 73 74, 76 71, 74 65 C 72 60, 66 61, 62 63 C 48 70, 36 62, 35 52 C 34 38, 48 29, 62 35 C 67 37, 72 35, 73 30 C 74 25, 71 23, 68 28 Z" 
        fill="url(#planetGrad)" filter="url(#glow)"/>

  <!-- Saturn Orbiting Ring -->
  <path d="M 12 58 C 12 58, 22 38, 56 34 C 74 32, 90 40, 88 48 C 86 54, 74 58, 56 60 C 44 61, 30 58, 12 58 Z" 
        stroke="url(#ringGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95" />

  <!-- Orbiting Moons / Dots -->
  <circle cx="48" cy="46" r="2.5" fill="#fbcfe8" opacity="0.9"/>
  <circle cx="54" cy="42" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="43" cy="52" r="1.2" fill="#e9d5ff" opacity="0.7"/>
</svg>
