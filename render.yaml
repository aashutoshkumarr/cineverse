services:
  - type: web
    name: cineverse-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_READ_ACCESS_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://cineverse-teal-omega.vercel.app,http://localhost:3001
